$font = Noto Sans
$wallpaper = /usr/share/wallpapers/Next/contents/images_dark/5120x2880.png

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 4
    color = rgb(1a1b26)
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 82
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d  %A"
    color = rgb(a9b1d6)
    font_size = 22
    font_family = $font
    position = 0, 48
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = rgb(7aa2f7)
    inner_color = rgba(1a1b26dd)
    font_color = rgb(c0caf5)
    fail_color = rgb(f7768e)
    check_color = rgb(9ece6a)
    placeholder_text = 输入密码…
    fail_text = 验证失败
    fade_on_empty = false
    rounding = 12
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
}

