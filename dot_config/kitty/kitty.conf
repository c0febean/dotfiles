# Minimal Kitty configuration for the current Tokyo Night desktop.

# Font and spacing
font_family      JetBrainsMono Nerd Font
font_size        12.0
window_padding_width 8

# Tokyo Night colors
background              #1a1b26
foreground              #c0caf5
cursor                  #c0caf5
selection_background    #565f89
selection_foreground    #c0caf5

# Keep Kitty tabs and splits visually consistent with Hyprland's accent.
active_border_color     #565f89
inactive_border_color   #414868
active_tab_background   #565f89
active_tab_foreground   #c0caf5
inactive_tab_background #24283b
inactive_tab_foreground #a9b1d6

# Conservative, opaque native-Wayland window behavior.
background_opacity 1.0
background_blur    0
linux_display_server wayland

# Shell and terminal behavior
shell_integration enabled
scrollback_lines 10000
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Kitty's upstream tab, split, and session behavior/key bindings remain enabled.

# Clipboard ergonomics:
# Ctrl+C copies and clears an active Kitty selection; without a selection it
# remains the normal interrupt key. Ctrl+Alt+V sends a literal Ctrl+V to TUI
# programs such as Vim/Neovim, while Ctrl+Shift+C/V remain explicit fallbacks.
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+alt+v send_key ctrl+v

# In a normal shell, right-click copies the current selection and clears it.
# Do not grab right-click from applications that have taken mouse ownership
# (Vim, tmux, and other mouse-aware TUI programs).
mouse_map right press ungrabbed combine : copy_to_clipboard : clear_selection
